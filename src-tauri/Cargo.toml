[package]
name = "luma-desktop"
version = "0.9.3"
edition = "2021"
description = "Independent Luma Windows meter shell"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-runtime = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
luma-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
