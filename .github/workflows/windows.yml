name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - name: Source and packaging tests
        run: |
          python -m unittest discover -s tools/tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package.py --check-source
      - name: Formatting
        run: |
          cargo fmt --manifest-path engine/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Engine tests
        run: cargo test --manifest-path engine/Cargo.toml --locked
      - name: Desktop tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Frontend tests
        run: node --test ui/tests/*.test.mjs
      - name: Release build
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --locked
      - name: Portable and source packages
        run: python tools/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luma-windows-preview
          path: |
            release/*-windows-x64.zip
            release/*-source.zip
            release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
