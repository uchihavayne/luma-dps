<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'">
  <title>Luma DPS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pets.css">
  <link rel="stylesheet" href="fullscreen.css">
  <link rel="stylesheet" href="records.css">
  <link rel="stylesheet" href="spatial.css">
  <link rel="stylesheet" href="clear.css">
</head>
<body>
  <main id="meter" class="meter" aria-label="Luma DPS">
    <header class="topbar">
      <div class="brand" id="drag-region"><span class="brand-mark" aria-hidden="true">◈</span><span>LUMA <small>DPS</small></span></div>
      <button id="compact-status" class="compact-status" aria-label="Ölçüm durumu" hidden>!</button>
      <button id="identity-button" class="identity-button" aria-label="Karakterini seç"><span aria-hidden="true">◎</span><span id="identity-name">Karakter</span></button>
      <span id="connection" class="connection" role="status" aria-live="polite"><i aria-hidden="true"></i><span>—</span><small id="latency-chip" class="latency-chip" hidden>— ms</small></span>
      <button id="cube-entry" class="cube-entry" aria-label="Hidden Cube ses ayarları" title="Hidden Cube ses ayarları"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/></svg><i aria-hidden="true"></i></button>
      <button id="compact-button" class="icon-button" aria-label="Kompakt görünüm" aria-pressed="false" title="Kompakt görünüm"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="2"/><path d="M3 8h14"/></svg></button>
      <button id="fullscreen-button" class="icon-button" aria-label="Saydam tam ekran" aria-pressed="false" title="Saydam tam ekran"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button>
      <button id="modules-button" class="icon-button modules-button" aria-label="Görünür modülleri seç" title="Görünür modülleri seç" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg></button>
      <button id="settings-button" class="icon-button" aria-label="Ayarlar" title="Ayarlar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8.5 2.5-.4 1.6-1.6.9-1.6-.5-1.5 2.6 1.2 1.1v1.8L3.4 11.1l1.5 2.6 1.6-.5 1.6.9.4 1.6h3l.4-1.6 1.6-.9 1.6.5 1.5-2.6-1.2-1.1V8.2l1.2-1.1-1.5-2.6-1.6.5-1.6-.9-.4-1.6z" transform="translate(0 .9)"/><circle cx="10" cy="10" r="2.3"/></svg></button>
      <button id="tools-button" class="icon-button tools-button" aria-label="Araçlar ve görünüm" title="Araçlar ve görünüm" aria-expanded="false" aria-controls="tools-menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <button id="close-window" class="icon-button close-window" aria-label="Pencereyi kapat" title="Pencereyi kapat">×</button>
    </header>
    <section class="encounter-header">
      <div class="target-label" id="target-label">HEDEF</div>
      <div class="target-line"><h1 id="target-name">—</h1><span id="combat-time" class="combat-time">00:00</span></div>
      <button id="event-chip" class="event-chip" hidden><span id="event-name"></span><time id="event-time"></time><span aria-hidden="true">↗</span></button>
      <div id="target-vitals" class="target-vitals" hidden><span id="target-hp"></span><i id="target-hp-track" role="progressbar" aria-label="Hedef canı" aria-valuemin="0" aria-valuemax="100"><b></b></i><span id="target-hp-percent" class="target-hp-percent"></span></div>
    </section>
    <section class="metrics" aria-label="Hasar özeti">
      <div class="primary-metric"><span class="metric-label" id="dps-label">KİŞİSEL DPS</span><strong id="dps-value">0/sn</strong><span id="mode-caption" class="metric-caption"></span></div>
      <div class="secondary-metric"><span class="metric-label" id="damage-label">TOPLAM HASAR</span><strong id="damage-value">0</strong><div id="boss-summary" class="metric-caption" hidden></div></div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <button id="combat-warning" class="combat-warning" hidden aria-live="polite"><span aria-hidden="true">◇</span><span id="combat-warning-text"></span><time id="combat-warning-time"></time></button>
    <section class="roster-controls" aria-label="Liste kontrolleri">
      <label class="scope-label"><span class="sr-only" id="scope-label">Ölçüm kapsamı</span><select id="damage-scope" aria-labelledby="scope-label"><option value="personal">Kişisel</option><option value="party">Grup</option><option value="observed">Gözlenen</option><option value="target" hidden disabled>Hedef · 10</option></select></label>
      <div class="segmented" id="target-modes" role="group" aria-label="Hedef modu">
        <button data-mode="all" aria-pressed="true">Tümü</button><button data-mode="boss" aria-pressed="false">Boss</button><button data-mode="both" aria-pressed="false">İkisi</button>
      </div>
      <label class="sort-label"><span class="sr-only" id="sort-label">Sıralama</span><select id="sort" aria-labelledby="sort-label"><option value="dps">DPS ↓</option><option value="damage">Hasar ↓</option><option value="name">A–Z</option></select></label>
      <div class="clear-column-headings" aria-hidden="true"><span id="column-rate">DPS</span><span id="column-damage">Toplam</span><span id="column-share">%</span></div>
    </section>
    <div id="live-tools" class="live-tools" hidden><button id="control-chip" hidden></button><button id="frenzy-chip" hidden></button><button id="hp-chip" hidden></button><button id="pvp-chip" hidden aria-expanded="false" aria-controls="pvp-popover"></button><button id="odyle-chip" hidden></button><button id="team-chip" hidden></button><button id="pet-chip">Pet rehberi</button><button id="radar-chip" aria-expanded="false">Radar</button></div>
    <section class="roster-stage" aria-label="Oyuncular ve yakın Küp sinyali">
      <div class="roster-list"><section id="target-board-controls" class="target-board-controls" aria-label="Hedef katkı listesi"><label for="target-board-select" id="target-board-caption">Hedef · İlk 10</label><select id="target-board-select"><option value="auto">Otomatik</option><option value="off">Kapalı</option></select><button id="show-all-targets" class="text-button" type="button" hidden>Tümü’ne geç</button></section><aside id="target-pet-pin" class="target-pet-pin" aria-label="Vurulan mobun petini sabitle" hidden></aside><section id="module-home" class="module-home" aria-label="Seçili modüller" hidden></section><section id="pet-tracker" class="pet-tracker" aria-label="Pet takibi" hidden></section><section id="radar-dock" class="radar-dock" aria-label="Radar" hidden></section><div class="list-heading"><span id="player-label">OYUNCU</span><span class="heading-total" id="heading-total">TOPLAM HASAR · DPS</span></div><section id="target-roster-strip" class="target-roster-strip" hidden><div class="target-roster-heading"><strong id="target-roster-label"></strong><span id="target-roster-coverage"></span></div><div id="target-dps-panel" class="target-dps-panel"><div><small id="target-total-caption">HEDEF DPS</small><strong id="target-total-rate">—</strong><span id="target-total-damage"></span></div><div><small id="target-personal-caption">KİŞİSEL DPS</small><strong id="target-personal-rate">—</strong><span id="target-personal-rank"></span></div></div></section><section id="players" class="players" aria-label="Oyuncular"></section><p id="roster-unnamed" class="roster-unnamed" role="status" hidden></p></div>
      <aside id="cube-navigator" class="cube-navigator" aria-label="Hidden Cube pusulası" hidden>
        <div class="cube-nav-heading"><strong>HIDDEN CUBE</strong><button id="cube-nav-size" class="icon-button" aria-label="Pusulayı büyüt" title="Pusulayı büyüt">⤢</button></div>
        <span id="cube-nav-source" class="cube-nav-source"></span>
        <div class="cube-compass" id="cube-compass" role="img" aria-label="Stereo ses yönü" data-cube-compass>
          <svg class="cube-compass-svg" viewBox="0 0 160 160" aria-hidden="true">
            <circle class="cube-compass-surface" cx="80" cy="80" r="74"/><circle class="cube-compass-outer" cx="80" cy="80" r="70"/><circle class="cube-compass-inner" cx="80" cy="80" r="52"/>
            <path class="cube-compass-guides" d="M80 8v12M80 140v12M8 80h12M140 80h12M29 29l7 7M124 124l7 7M29 131l7-7M124 36l7-7"/><path class="cube-compass-front" d="M30.5 30.5A70 70 0 0 1 129.5 30.5"/>
            <circle class="cube-compass-strength" cx="80" cy="80" r="62" pathLength="100"/>
            <g class="cube-compass-ghost"><path d="M80 76V31"/><path d="m80 22-7 13 7-4 7 4z"/></g><g class="cube-compass-needle"><path d="M80 84V31"/><path d="m80 20-9 16 9-5 9 5z"/></g>
            <circle class="cube-compass-core" cx="80" cy="80" r="11"/><path class="cube-compass-gem" d="m80 73 7 7-7 7-7-7z"/>
          </svg><span class="cube-compass-left">SOL</span><span class="cube-compass-right">SAĞ</span>
        </div>
        <strong id="cube-nav-direction" class="cube-nav-direction"></strong><span id="cube-nav-guidance" class="cube-nav-guidance">Stereo · ön/arka belirsiz</span><span id="cube-nav-trend" class="cube-nav-trend"></span><span id="cube-nav-network" class="cube-nav-network" hidden><span id="cube-nav-kind" class="cube-nav-kind" data-look=""><img id="cube-nav-art" class="cube-nav-art" alt="" width="22" height="22" draggable="false"><small id="cube-nav-kind-name"></small></span><b id="cube-nav-network-distance"></b><small id="cube-nav-network-detail"></small></span>
        <div class="cube-nav-readings"><span><b id="cube-nav-similarity">—</b><small id="cube-nav-similarity-label">Benzerlik</small></span><span><b id="cube-nav-strength">—</b><small id="cube-nav-strength-label">Sinyal</small></span></div>
      </aside>
    </section>
    <section id="skill-board" class="skill-board" role="region" aria-label="Yeteneklerim" aria-live="off" hidden></section>
    <footer class="footer">
      <div class="footer-controls"><button id="pause-button" class="icon-button" aria-label="Duraklat" title="Duraklat">Ⅱ</button><button id="reset-button" class="icon-button" aria-label="Sıfırla" title="Sıfırla"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 5.5A6 6 0 1 1 4 12M5 2.5v4H1"/></svg></button><button id="lock-button" class="icon-button" aria-label="Kilitle" aria-pressed="false" title="Kilitle">◇</button><button id="training-button" class="icon-button" aria-label="Süreli antrenman" title="Süreli antrenman"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11" r="6"/><path d="M10 11V7m-2-5h4m-2 0v3m4.5.5L16 4"/></svg></button></div>
      <div id="roster-summary" class="roster-summary" aria-label="DPS kapsamları"><span data-summary-scope="personal"><small>BEN</small><strong>—</strong></span><span data-summary-scope="party"><small>TAKIM</small><strong>—</strong></span><span data-summary-scope="observed"><small>YAKIN</small><strong>—</strong></span></div>
      <span id="clear-roster-summary" class="clear-roster-summary"></span>
      <span id="compact-summary" class="compact-summary" role="button" tabindex="0" aria-expanded="true" aria-controls="skill-board"><span id="compact-summary-label"></span><b id="compact-summary-rate"></b><span id="compact-summary-damage"></span></span>
      <button id="dps-view-button" class="text-button" hidden>DPS’i aç</button><button id="analysis-button" class="text-button">Analiz ↗</button>
      <button id="resize-button" class="resize-button" aria-label="Pencereyi yeniden boyutlandır" title="Pencereyi yeniden boyutlandır"><span aria-hidden="true">◢</span></button>
    </footer>
    <section id="pvp-popover" class="skill-popover pvp-popover" role="region" aria-label="PvP" hidden></section>
    <section id="tools-menu" class="tools-menu" role="dialog" aria-label="Araçlar ve görünüm" hidden></section>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <section id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
      <div class="drawer-header" id="drawer-drag-region"><div><span class="eyebrow">LUMA DPS</span><h2 id="drawer-title"></h2></div><button id="close-drawer" class="icon-button" aria-label="Kapat" title="Kapat">×</button></div>
      <nav id="drawer-groups" class="drawer-groups" aria-label="Analiz grupları" hidden></nav>
      <nav id="drawer-tabs" class="drawer-tabs" role="tablist" aria-label="Analiz bölümleri" hidden></nav>
      <div id="drawer-content" class="drawer-content"></div>
    </section>
    <aside id="record-notice" class="record-notice" aria-label="Kişisel rekor" hidden>
      <span class="record-notice-mark" aria-hidden="true">◇</span>
      <div class="record-notice-copy" role="status" aria-live="polite" aria-atomic="true"><strong id="record-notice-title"></strong><span id="record-notice-name"></span><small id="record-notice-label"></small></div>
      <div class="record-notice-score"><b id="record-notice-value"></b><small id="record-notice-gain"></small></div>
      <button id="dismiss-record" type="button" class="icon-button" aria-label="Rekor bildirimini kapat">×</button>
    </aside>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
